
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLDEN HUB</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 25px 15px;
  text-align: center;
  border-bottom: 1px solid #b58b32;
}
.logo {
  color: #d6ad54;
  font-size: 30px;
  font-weight: bold;
}
header p { color: #aaa; }
.hero {
  text-align: center;
  padding: 55px 20px;
}
.hero h1 { color: #e3bd67; }
.hero p { color: #ccc; line-height: 1.6; }
button {
  background: #c49a43;
  color: #080808;
  border: none;
  padding: 13px 25px;
  border-radius: 8px;
  font-weight: bold;
}
section { padding: 20px; }
h2 { color: #d6ad54; }
.card {
  background: #171717;
  border: 1px solid #725724;
  border-radius: 12px;
  padding: 20px;
  margin: 15px 0;
}
.card p { color: #bbb; }
.price { color: #e5bd62; font-size: 23px; }
footer {
  text-align: center;
  padding: 25px;
  color: #888;
}
</style>
</head>
<body>
<header>
  <div class="logo">👑 GOLDEN HUB</div>
  <p>O seu universo gamer</p>
</header>

<div class="hero">
  <h1>BEM-VINDO À GOLDEN HUB</h1>
  <p>Um espaço gamer com estilo, exclusividade e confiança.</p>
  <button onclick="document.getElementById('catalogo').scrollIntoView()">
    EXPLORAR
  </button>
</div>

<section id="catalogo">
  <h2>✦ CATÁLOGO</h2>
  <div class="card">
    <h3>🎮 Free Fire</h3>
    <p>Espaço para conhecer nossos anúncios.</p>
    <p class="price">Em breve</p>
  </div>
</section>

<footer>
  GOLDEN HUB © 2026<br>
  Todos os direitos reservados.
</footer>
</body>
  </html>
